services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nti-backend/storage/app/public:/var/www/storage/app/public:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
 
  frontend:
    build: ./nti-frontend
    working_dir: /app
    volumes:
      - ./nti-frontend:/app:cached
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt_cache:/app/.nuxt
    ports:
      - "3000:3000"
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_API_BASE: http://backend:8000/api
      NUXT_PUBLIC_API_BASE: http://localhost/api
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    networks:
      - app-network
 
  backend:
    build: ./nti-backend
    working_dir: /var/www
    volumes:
      - ./nti-backend:/var/www:cached
      - backend_vendor:/var/www/vendor
    ports:
      - "8000:8000"
    command: >
      sh -c "
      if [ ! -L public/storage ]; then
        php artisan storage:link;
      fi &&
      exec php artisan serve --host=0.0.0.0 --port=8000"
    env_file:
      - ./nti-backend/.env
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - app-network
 
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nti
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d nti"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
 
  queue:
    build: ./nti-backend
    working_dir: /var/www
    volumes:
      - ./nti-backend:/var/www:cached
      - backend_vendor:/var/www/vendor
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - ./nti-backend/.env
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - app-network

  scheduler:
    build: ./nti-backend
    working_dir: /var/www
    volumes:
      - ./nti-backend:/var/www:cached
      - backend_vendor:/var/www/vendor
    command: php artisan schedule:work
    env_file:
      - ./nti-backend/.env
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - app-network
 
  cache:
    image: redis:7
    restart: unless-stopped
    networks:
      - app-network
 
networks:
  app-network:
    driver: bridge
 
volumes:
  db-data:
  frontend_node_modules:
  frontend_nuxt_cache:
  backend_vendor: